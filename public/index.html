<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المرابحة المؤسسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6 font-sans">

    <div class="max-w-6xl mx-auto">
        <!-- شريط المحفظة والرأس -->
        <header class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">منصة المرابحة المؤسسية</h1>
                <p class="text-sm text-gray-500">استثمر في مشاريع المرابحة المعتمدة</p>
            </div>
            <div class="bg-blue-50 text-blue-800 px-5 py-3 rounded-xl font-bold border border-blue-100 flex items-center gap-2">
                <span>💰 المحفظة:</span>
                <span id="wallet-balance" class="text-lg">10,000</span>
                <span>$</span>
            </div>
        </header>

        <!-- شبكة المشاريع -->
        <h2 class="text-xl font-bold text-gray-800 mb-4">مشاريع الاستثمار المتاحة</h2>
        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl shadow text-center text-gray-500 col-span-2">جاري تحميل المشاريع والمحفظة...</div>
        </div>
    </div>

    <script>
        let currentWallet = 10000;

        async function fetchProjects() {
            try {
                const response = await fetch('/api/projects');
                const data = await response.json();
                
                if (!data.success) return;

                const grid = document.getElementById('projects-grid');
                grid.innerHTML = '';

                data.projects.forEach(project => {
                    const percentage = Math.min(100, Math.round((project.fundedAmount / project.totalFunding) * 100));
                    
                    grid.innerHTML += `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
                            <div class="p-6">
                                <div class="flex justify-between items-center mb-3">
                                    <h3 class="text-xl font-bold text-gray-900">${project.title}</h3>
                                    <span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm font-bold">⭐ ${project.rating}</span>
                                </div>
                                <p class="text-gray-600 text-sm mb-6 leading-relaxed">${project.description}</p>
                                
                                <!-- شريط تقدم التمويل -->
                                <div class="space-y-2 mb-6">
                                    <div class="flex justify-between text-xs font-semibold text-gray-500">
                                        <span>الممول: $${project.fundedAmount.toLocaleString()}</span>
                                        <span>الهدف: $${project.totalFunding.toLocaleString()} (${percentage}%)</span>
                                    </div>
                                    <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
                                        <div class="bg-blue-600 h-full rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
                                    </div>
                                </div>

                                <button onclick="invest(${project.id}, 1000)" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-200">
                                    استثمار $1,000 من المحفظة
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("خطأ في الاتصال بالخادم:", err);
            }
        }

        function invest(projectId, amount) {
            if (currentWallet >= amount) {
                currentWallet -= amount;
                document.getElementById('wallet-balance').innerText = currentWallet.toLocaleString();
                alert(`تم استثمار $${amount} بنجاح! الرصيد المتبقي: $${currentWallet.toLocaleString()}`);
            } else {
                alert("رصيد المحفظة غير كافٍ!");
            }
        }

        fetchProjects();
    </script>
</body>
</html>
