<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة المرابحة المؤسسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 border-b border-slate-700 pb-4">مشاريع الاستثمار المتاحة</h1>
        <div id="content">جاري تحميل البيانات...</div>
    </div>
    <script>
        fetch('/api/projects')
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    let html = '';
                    data.projects.forEach(p => {
                        html += '<div class="bg-slate-800 p-4 mb-4 rounded shadow"><h2>' + p.title + '</h2><p>' + p.description + '</p></div>';
                    });
                    document.getElementById('content').innerHTML = html;
                }
            });
    </script>
</body>
</html>
